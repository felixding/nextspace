<!doctype html>
<meta charset="utf-8">
<title>Native temporal fields</title>
<style>body{margin:32px;background:white;font:16px sans-serif}label{display:block;margin:20px 0}input{width:420px;height:34px;font:16px sans-serif}</style>
<label>Time <input id="clock" type="time" value="23:59:59.875" step="0.001"></label>
<label>Empty time <input id="emptyClock" type="time" step="0.001"></label>
<label>Date and time <input id="stamp" type="datetime-local" value="2026-11-07T23:59:59.875" step="0.001"></label>
<label>Empty date and time <input id="emptyStamp" type="datetime-local" step="0.001"></label>
<label>Read only <input id="readonlyClock" type="time" value="12:34:56.125" step="0.001" readonly></label>
<label>Disabled <input id="disabledStamp" type="datetime-local" value="2026-11-07T12:34:56.125" step="0.001" disabled></label>
<button id="after">After fields</button>
<script>
window.events=[];
for(const element of document.querySelectorAll('input'))
 for(const type of ['input','change'])
  element.addEventListener(type,event=>window.events.push({id:element.id,type,value:element.value,trusted:event.isTrusted}));
</script>
