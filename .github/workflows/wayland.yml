name: Wayland ARM64
on:
  push:
    branches: [master]
  pull_request:
env:
  DOCKER_DEFAULT_PLATFORM: linux/arm64
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux test environment
        run: docker build -f Tests/Wayland/Dockerfile -t nextspace-wayland-test .
      - name: Build NEXTSPACE runtime test environment
        run: docker build -f Tests/Wayland/Dockerfile.native-stack -t nextspace-native-stack-test .
      - name: Build and exercise desktop backends
        run: |
          mkdir -p wayland-results
          docker run --init --name nextspace-wayland-test -v "$PWD/wayland-results:/results" \
            -e NEXTSPACE_WAYLAND_BUILD_DIR=/results nextspace-native-stack-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayland-results-native
          path: |
            wayland-results/*.log
            wayland-results/package-versions.txt
            wayland-results/native-runtime.txt
            wayland-results/native-stack-sources.json
            wayland-results/source-hashes.json
            wayland-results/wlroots-source-hashes.json
            wayland-results/compositor-libraries.txt
            wayland-results/results/
  desktop-packages:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated package environment
        run: |
          docker build -f Tests/Wayland/Dockerfile -t nextspace-wayland-test .
          docker build -f Tests/Wayland/Dockerfile.native-stack -t nextspace-native-stack-test .
      - name: Cold build, offline replay and clean desktop upgrade
        run: sh Tests/Wayland/desktop-packages.sh desktop-package-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayland-desktop-packages
          path: desktop-package-results/
