<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <image id="review-photo-source" href="ReviewCoast.png" width="33" height="24" preserveAspectRatio="none" />
    <linearGradient id="review-photo-upper-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="7">
      <stop offset="0" stop-color="white" stop-opacity="1" />
      <stop offset="0.78" stop-color="white" stop-opacity="1" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="review-photo-upper" maskUnits="userSpaceOnUse" x="0" y="0" width="33" height="7">
      <path d="M0 0h33v7h-33Z" fill="url(#review-photo-upper-gradient)" />
    </mask>
    <filter id="review-photo-upper-colors" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1" intercept="0.023529411764705882" />
        <feFuncG type="linear" slope="1" intercept="0.011764705882352941" />
        <feFuncB type="linear" slope="1" intercept="0.06274509803921569" />
      </feComponentTransfer>
    </filter>
    <linearGradient id="review-photo-cloud-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="5.8" x2="0" y2="11.2">
      <stop offset="0" stop-color="white" stop-opacity="0" />
      <stop offset="0.17" stop-color="white" stop-opacity="1" />
      <stop offset="0.85" stop-color="white" stop-opacity="1" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="review-photo-cloud" maskUnits="userSpaceOnUse" x="0" y="5.8" width="33" height="5.4">
      <path d="M0 5.8h33v5.4h-33Z" fill="url(#review-photo-cloud-gradient)" />
    </mask>
    <filter id="review-photo-cloud-colors" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1" intercept="0.0392156862745098" />
        <feFuncG type="linear" slope="1" intercept="0.050980392156862744" />
        <feFuncB type="linear" slope="1" intercept="0.07058823529411765" />
      </feComponentTransfer>
    </filter>
    <linearGradient id="review-photo-horizon-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="11" x2="0" y2="14.5">
      <stop offset="0" stop-color="white" stop-opacity="0" />
      <stop offset="0.2" stop-color="white" stop-opacity="0.65" />
      <stop offset="0.8" stop-color="white" stop-opacity="0.65" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="review-photo-horizon" maskUnits="userSpaceOnUse" x="17" y="11" width="16" height="3.5">
      <path d="M17 11h16v3.5h-16Z" fill="url(#review-photo-horizon-gradient)" />
    </mask>
    <filter id="review-photo-horizon-colors" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1" intercept="-0.01568627450980392" />
        <feFuncG type="linear" slope="1" intercept="0.011764705882352941" />
        <feFuncB type="linear" slope="1" intercept="0.050980392156862744" />
      </feComponentTransfer>
    </filter>
    <linearGradient id="review-photo-water-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="13.8" x2="0" y2="24.0">
      <stop offset="0" stop-color="white" stop-opacity="0" />
      <stop offset="0.04" stop-color="white" stop-opacity="1" />
      <stop offset="1" stop-color="white" stop-opacity="1" />
    </linearGradient>
    <mask id="review-photo-water" maskUnits="userSpaceOnUse" x="0" y="13.8" width="33" height="10.2">
      <path d="M0 13.8h33v10.2h-33Z" fill="url(#review-photo-water-gradient)" />
    </mask>
    <filter id="review-photo-water-colors" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1" intercept="0.06666666666666667" />
        <feFuncG type="linear" slope="1" intercept="0.09411764705882353" />
        <feFuncB type="linear" slope="1" intercept="0.09411764705882353" />
      </feComponentTransfer>
    </filter>
    <symbol id="review-photograph" viewBox="0 0 33 24">
      <use href="#review-photo-source" />
      <use href="#review-photo-source" filter="url(#review-photo-upper-colors)" mask="url(#review-photo-upper)" />
      <use href="#review-photo-source" filter="url(#review-photo-cloud-colors)" mask="url(#review-photo-cloud)" />
      <use href="#review-photo-source" filter="url(#review-photo-horizon-colors)" mask="url(#review-photo-horizon)" />
      <use href="#review-photo-source" filter="url(#review-photo-water-colors)" mask="url(#review-photo-water)" />
    </symbol>
    <clipPath id="review-photo-glass">
      <use href="MonitorScreens.svg#monitor-glass-outline" />
    </clipPath>
    <symbol id="review-screen" viewBox="0 0 48 48">
      <g clip-path="url(#review-photo-glass)">
        <path d="M0 0H48V48H0Z" fill="url(#review-photo-edge-colors)" />
        <use href="#review-photograph" x="7.3" y="6.8" width="33.2" height="24.145454545454548" preserveAspectRatio="none" />
      </g>
    </symbol>
    <linearGradient id="review-photo-edge-colors" gradientUnits="userSpaceOnUse" x1="0" y1="6.1" x2="0" y2="32.45">
      <stop offset="0" stop-color="#12275f" />
      <stop offset=".53" stop-color="#426b9f" />
      <stop offset=".58" stop-color="#507e96" />
      <stop offset=".9" stop-color="#888b87" />
      <stop offset="1" stop-color="#958478" />
    </linearGradient>
  </defs>
  <use id="preview" href="#review-screen" />
</svg>