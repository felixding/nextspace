<!doctype html>
<meta charset="utf-8">
<title>Native slider model transport</title>
<style>
body { margin:24px; background:white; color:black; font:16px sans-serif; }
.row { display:flex; align-items:center; gap:20px; height:48px; }
label { width:170px; }
input[type=range] { display:block; width:240px; height:24px; padding:0; margin:0; }
#vertical { width:24px; height:160px; writing-mode:vertical-lr; }
</style>
<h1>Standard HTML sliders</h1>
<div class="row"><label for="range">Default</label><input id="range" type="range" value="50"></div>
<div class="row"><label for="custom">Custom range</label><input id="custom" type="range" min="-10" max="10" step="any" value="0"></div>
<div class="row"><label for="disabled">Disabled</label><input id="disabled" type="range" value="35" disabled></div>
<div class="row"><label for="coarse">Coarse values</label><input id="coarse" type="range" min="0" max="100" step="20" value="40"></div>
<div style="display:flex;gap:20px;margin-top:16px"><label for="vertical">Vertical</label><input id="vertical" type="range" min="0" max="100" step="any" value="25"></div>
<script>
window.events=[];
for(const type of ['mousedown','mousemove','mouseup','click','keydown','keyup','input','change'])
 document.addEventListener(type,e=>events.push({type,id:e.target.id,value:e.target.value,key:e.key,trusted:e.isTrusted}));
</script>
