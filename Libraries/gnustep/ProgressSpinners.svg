<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Original GNUstep stepped spinner disk. Four exact cardinal states and measured diagonal contours. SPDX-License-Identifier: LGPL-2.1-or-later. -->
  <defs>
    <path id="progress-spinner-cut" d="M-16 -16 H24 V16 H16 V24 H-16 Z" />
    <radialGradient id="progress-spinner-alpha-cardinal" gradientUnits="userSpaceOnUse" cx="16" cy="16" r="16">
      <stop offset="1" stop-color="white" stop-opacity="1" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </radialGradient>
    <mask id="progress-spinner-disk-cardinal" maskUnits="userSpaceOnUse" x="-4" y="-4" width="40" height="40">
      <rect x="-4" y="-4" width="40" height="40" fill="url(#progress-spinner-alpha-cardinal)" />
    </mask>
    <g id="progress-spinner-cardinal" mask="url(#progress-spinner-disk-cardinal)">
      <rect x="-4" y="-4" width="40" height="40" fill="#fff" />
      <use href="#progress-spinner-cut" fill="#000" />
    </g>
    <radialGradient id="progress-spinner-alpha-diagonal" gradientUnits="userSpaceOnUse" cx="16" cy="16" r="15.95">
      <stop offset="1" stop-color="white" stop-opacity="1" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </radialGradient>
    <mask id="progress-spinner-disk-diagonal" maskUnits="userSpaceOnUse" x="-4" y="-4" width="40" height="40">
      <rect x="-4" y="-4" width="40" height="40" fill="url(#progress-spinner-alpha-diagonal)" />
    </mask>
    <g id="progress-spinner-diagonal" mask="url(#progress-spinner-disk-diagonal)">
      <rect x="-4" y="-4" width="40" height="40" fill="#fefefe" />
      <path d="M-32 -64 H96 V-53.064 L21.718 21.218 L16.218 15.718 L10.5 21.436 L-32 -21.064 Z" transform="translate(-.15 .35)" fill="#010101" shape-rendering="geometricPrecision" />
    </g>
    <symbol id="progress-spinner-1-design" viewBox="0 0 32 32">
      <use href="#progress-spinner-cardinal" transform="rotate(0 16 16)" />
    </symbol>
    <symbol id="progress-spinner-2-design" viewBox="0 0 32 32">
      <use href="#progress-spinner-diagonal" transform="rotate(0 16 16) translate(.15 -.35)" />
    </symbol>
    <symbol id="progress-spinner-3-design" viewBox="0 0 32 32">
      <use href="#progress-spinner-cardinal" transform="rotate(90 16 16)" />
    </symbol>
    <symbol id="progress-spinner-4-design" viewBox="0 0 32 32">
      <use href="#progress-spinner-diagonal" transform="rotate(90 16 16) translate(.15 -.35)" />
    </symbol>
    <symbol id="progress-spinner-5-design" viewBox="0 0 32 32">
      <use href="#progress-spinner-cardinal" transform="rotate(180 16 16)" />
    </symbol>
    <symbol id="progress-spinner-6-design" viewBox="0 0 32 32">
      <use href="#progress-spinner-diagonal" transform="rotate(180 16 16) translate(.15 -.35)" />
    </symbol>
    <symbol id="progress-spinner-7-design" viewBox="0 0 32 32">
      <use href="#progress-spinner-cardinal" transform="rotate(270 16 16)" />
    </symbol>
    <symbol id="progress-spinner-8-design" viewBox="0 0 32 32">
      <use href="#progress-spinner-diagonal" transform="rotate(270 16 16) translate(.15 -.35)" />
    </symbol>
  </defs>
  <use id="preview" href="#progress-spinner-1-design" />
</svg>